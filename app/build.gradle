plugins {
    id 'com.android.application'
}

def buildNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.production.monitoring'
    compileSdk 34

    defaultConfig {
        applicationId "com.production.monitoring.app"
        minSdk 24
        targetSdk 34
        versionCode buildNum
        versionName "1.${buildNum}"
    }

    signingConfigs {
        debug {
            storeFile file("signing.keystore")
            storePassword "android123"
            keyAlias "appkey"
            keyPassword "android123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
